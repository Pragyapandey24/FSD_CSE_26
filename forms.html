<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    
    <h1 align="center">Student Registration Form</h1>
    <table align="center">
        <form>
            <tr>
                <td>Roll No. :</td>
                <td><input type="text" name="roll_no."></td>
            </tr>
            <tr>
                <td>Student name :</td>
                <td>
                    <input type="text" name="first_name" placeholder="First Name">
                    <input type="text" name="first_name" placeholder="Last Name">
                </td>
            </tr>
            <tr>
                <td>Father's Name</td>
                <td><input type="text" name="father_name"></td>
            </tr>
            <tr>
                <td>Date of Birth :</td>
                <td>
                    <input placeholder="Day" size="3">
                    <input placeholder="Month" size="3">
                    <input placeholder="Year" size="3">
                </td>
            </tr>
            <tr>
                <td>Mobile no. :</td>
                <td>
                    <input type="text" value="+91" size="2">
                    <input type="text" name="mobile_no">
                </td>
            </tr>

            <!-- Email id -->
            <tr>
                <td>Email id :</td>
                <td><input type="email" name="email"></td>
            </tr>

            <!-- Password -->
            <tr>
                <td>Password :</td>
                <td><input type="password" name="password"></td>
            </tr>
        </form>
    </table>
    
</body>
</html>
